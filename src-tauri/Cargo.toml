[package]
name = "toknisland"
version = "0.1.0-alpha.0"
description = "Local-first desktop cockpit for AI agent CLI sessions."
authors = ["Maxen"]
edition = "2021"

[lib]
name = "toknisland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync"] }
portable-pty = "0.9"
